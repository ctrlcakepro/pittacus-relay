<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" class="hm hm-intro hm-live hm-active" style="--hm-ink:#0b0b0c;--hm-tile:#ffffff;--hm-w:24px;--hm-dot-y:780px"><style> .hm { --hm-ink: #fff; --hm-tile: #0b0b0c; --hm-w: 24px; --hm-dot-y: 780px; display: block; flex: none; overflow: visible; } .hm-tile { fill: var(--hm-tile); } .hm-line, .hm-bead { fill: none; stroke: var(--hm-ink); stroke-linecap: round; stroke-linejoin: round; } .hm-line { stroke-width: var(--hm-w); } .hm-dot { fill: var(--hm-ink); } .hm g, .hm-dot, .hm-ring { transform-box: view-box; transform-origin: 512px 728px; } .hm .hm-core, .hm .hm-dot, .hm .hm-ring { transform-origin: 512px var(--hm-dot-y); } .hm-intro .hm-dot { animation: hm-pop 0.56s cubic-bezier(0.3, 1.6, 0.5, 1) both; } .hm-intro .hm-open { animation: hm-open 1s var(--dl) cubic-bezier(0.2, 0.9, 0.25, 1.18) both; } .hm-intro .hm-line { stroke-dasharray: 1.02 1.02; animation: hm-draw 0.78s var(--dl) cubic-bezier(0.3, 0.6, 0.2, 1) both; } @keyframes hm-pop { 0% { transform: scale(0); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } } @keyframes hm-open { from { transform: rotate(var(--r0)) scale(0.72); } to { transform: none; } } @keyframes hm-draw { from { stroke-dashoffset: 1.02; } to { stroke-dashoffset: 0; } } .hm-live .hm-sway { animation: hm-sway var(--sp) var(--sd) ease-in-out infinite alternate; } .hm-live .hm-core { animation: hm-breathe 2.8s ease-in-out infinite alternate; } @keyframes hm-sway { from { transform: rotate(calc(var(--sw) * -1)); } to { transform: rotate(var(--sw)); } } @keyframes hm-breathe { from { transform: scale(1); } to { transform: scale(1.1); } } .hm-bead { stroke-width: calc(var(--hm-w) * 1.8); stroke-dasharray: 0 2; opacity: 0; } .hm-ring { fill: none; stroke: var(--hm-ink); stroke-width: calc(var(--hm-w) * 0.3); opacity: 0; } .hm-active .hm-bead { animation: hm-bead 2.4s var(--bd) cubic-bezier(0.45, 0, 0.25, 1) infinite; } .hm-active .hm-ring { animation: hm-ring 2.4s cubic-bezier